<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Productos</title>
    <link rel="stylesheet" href="../base/style.css">
    <link rel="stylesheet" href="../base/responsividad.css">
    <link rel="stylesheet" href="../css/productos.css">
    <link rel="stylesheet" href="../css/productosResponsividad.css">
    <link rel="stylesheet" href="../css/registrarProductos.css">
    <link rel="stylesheet" href="../css/registrarProductosResponsividad.css">
    <!-- LINK DE LOS ICONOS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Añade esto en el <head> o antes de tus scripts -->
        <script src="https://cdn.jsdelivr.net/npm/uuid@8.3.2/dist/umd/uuid.min.js"></script>
</head>
<body>
    <header class="header">
        <div class="header__caja">
            <a href="https://hotwheels.com" target="_blank" rel="noopener noreferrer">
                <img class="header__img" src="../img/steamboatHTW.jpg" alt="steamboatHTW">
            </a>
            <h1 class="header__titulo" id="estiloNeo">Productos</h1>
            <nav class="header__nav">
                <ul class="header__lista">
                    <li class="header__item"><a href="../index.html" class="header__link">Inicio</a></li>
                    <li class="header__item"><a href="productos.html" class="header__link">Productos</a></li>
                    <li class="header__item"><a href="proveedores.html" class="header__link">Proveedores</a></li>
                    <li class="header__item"><a href="eventos.html" class="header__link">Eventos</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="main productos">
        <section class="productos__control">
            <div class="productos__buscador" data-caja-autos>
                <input type="text" 
                       class="productos__input" 
                       placeholder="Buscar autitos..." 
                       data-search-input
                       aria-label="Buscar productos"
                       data-buscador-autos>
            </div>
            
            <a href="registrar_productos.html" target="_blank" class="productos__agregar">
                <span>Agregar</span>
                <i class="fas fa-plus-circle"></i>
            </a>
            
            
            <div class="productos__logo">
                <img src="../img/logoHTWoff.png" 
                     alt="Logo Hot Wheels" 
                     class="productos__logo-img"
                     data-logo>
            </div>
        </section>
        
        <section class="productos__grid" data-products-container>
            <!-- Las cards se agregarán dinámicamente con JavaScript -->
            <div class="productos__mensaje" data-mensaje-vacio>
                <i class="fas fa-car-side"></i>
                <p>No hay productos aún. ¡Agrega tu primer autito!</p>
            </div>
        </section>
    </main>

    <footer class="footer">
        <div class="footer__contenedor">
            <h2 class="footer__titulo">Contáctanos</h2>
            <div class="footer__redes">
                <a href="#" class="footer__link" aria-label="Instagram">
                    <i class="fab fa-instagram"></i>
                </a>
                <a href="#" class="footer__link" aria-label="WhatsApp">
                    <i class="fab fa-whatsapp"></i>
                </a>
                <a href="#" class="footer__link" aria-label="Facebook">
                    <i class="fab fa-facebook"></i>
                </a>
                <a href="#" class="footer__link" aria-label="LinkedIn">
                    <i class="fab fa-linkedin"></i>
                </a>
                <a href="#" class="footer__link" aria-label="GitHub">
                    <i class="fab fa-github"></i>
                </a>
                <a href="#" class="footer__link" aria-label="TikTok">
                    <i class="fab fa-tiktok"></i>
                </a>
                <a href="#" class="footer__link" aria-label="YouTube">
                    <i class="fab fa-youtube"></i>
                </a>
                <a href="#" class="footer__link" aria-label="Discord">
                    <i class="fab fa-discord"></i>
                </a>
            </div>
            <div class="footer__derechos">
                <p>&copy; 2025 IGNACIO ADRIAN LAYME DELGADO. Todos los derechos reservados.</p>
            </div>
        </div>
    </footer>

    
    <script type="module" src="../service/autito_controller.js"></script>
    <script type="module" src="../service/buscador_autito.js"></script>
</body>
</html>
