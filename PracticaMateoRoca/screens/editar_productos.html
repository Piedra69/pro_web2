        </div>

    <main class="main registrarProductos">
        <section class="registro">
            <h2 class="registro__titulo">Registrar Nuevo Autito</h2>
            
            <form class="registro__formulario" data-formulario-autos>
                <div class="registro__grupo">
                    <label for="nombre" class="registro__label">Nombre del Autito</label>
                    <input type="text" 
                           id="nombre" 
                           class="registro__input" 
                           data-input-nombre
                           maxlength="50"
                           required>
                    <span class="registro__contador" data-contador-nombre>0/50</span>
                </div>
                
                <div class="registro__grupo">
                    <label for="precio" class="registro__label">Precio (Bs)</label>
                    <input type="number" 
                           id="precio" 
                           class="registro__input" 
                           data-input-precio
                           inputmode="decimal"
                           pattern="^\d+(\.\d{1,2})?$"
                           placeholder="00.00"
                           required>
                    <span class="registro__ayuda">Ej: 25.99 (solo números con 2 decimales)</span>
                </div>
                
                <div class="registro__grupo">
                    <label for="caja" class="registro__label">Caja/Serie</label>
                    <input type="text" 
                           id="caja" 
                           class="registro__input" 
                           data-input-caja
                           maxlength="10"
                           required>
                    <span class="registro__contador" data-contador-caja>0/10</span>
                </div>
                
                <div class="registro__grupo">
                    <label for="gestion" class="registro__label">Gestión/Año</label>
                    <input type="number" 
                           id="gestion" 
                           class="registro__input" 
                           data-input-gestion
                           min="1968" 
                           max="2025"
                           step="1"
                           inputmode="numeric"
                           pattern="\d+"
                           value="2025"
                           required>
                </div>
                
                <script>
                    const inputGestion = document.getElementById('gestion');
                    inputGestion.addEventListener('input', () => {
                        inputGestion.value = inputGestion.value.replace(/[^0-9]/g, '');
                    });
                </script>
                
                <div class="registro__grupo">
                    <label for="color" class="registro__label">Color Principal</label>
                    <input type="text" 
                           id="color" 
                           class="registro__input" 
                           data-input-color
                           maxlength="30"
                           required>
                    <span class="registro__contador" data-contador-color>0/30</span>
                </div>
                
                <!--
                <div class="registro__grupo">
                    <label for="imagen" class="registro__label">Imagen del Autito</label>
                    <div class="registro__imagen-container">
                        <input type="file" 
                               id="imagen" 
                               class="registro__imagen-input" 
                               data-input-imagen
                               accept="image/*"
                               required>
                        <label for="imagen" class="registro__imagen-label">
                            <i class="fas fa-cloud-upload-alt"></i>
                            <span>Seleccionar imagen</span>
                        </label>
                        <div class="registro__imagen-preview" data-imagen-preview>
                            <i class="fas fa-car-side"></i>
                            <span>Vista previa aparecerá aquí</span>
                        </div>
                    </div>
                </div>
                -->
                
                <button type="submit" class="registro__boton" data-editar>
                    <i class="fas fa-save"></i>
                    <span>Editar Autito</span>
                </button>
            </form>
        </section>
    </main>
