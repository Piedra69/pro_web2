<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hot Wheels Tiendita</title>
    <link rel="stylesheet" href="base/style.css">
    <link rel="stylesheet" href="base/responsividad.css">
    <link rel="stylesheet" href="css/index.css">
    <link rel="stylesheet" href="css/indexResponsividad.css">
    <!-- LINK DE LOS ICONOS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header class="header">
        <div class="header__caja">
            <a href="https://hotwheels.com" target="_blank" rel="noopener noreferrer">
                <img class="header__img" src="img/steamboatHTW.jpg" alt="steamboatHTW">
            </a>
            <h1 class="header__titulo" id="estiloNeo">Hot Wheels Tiendita</h1>
            <nav class="header__nav">
                <ul class="header__lista">
                    <li class="header__item"><a href="index.html" class="header__link">Inicio</a></li>
                    <li class="header__item"><a href="screens/productos.html" class="header__link">Productos</a></li>
                    <li class="header__item"><a href="screens/proveedores.html" class="header__link">Proveedores</a></li>
                    <li class="header__item"><a href="screens/eventos.html" class="header__link">Eventos</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="main">
        <div class="pista">
            <div class="pista__linea"></div>
            
            <div class="auto auto--rojo">
                <div class="auto__techo"></div>
                <div class="auto__cabina"></div>
                <div class="auto__parabrisas"></div>
                <div class="auto__spoiler"></div>
                <div class="auto__luces"></div>
                <div class="auto__rueda auto__rueda--delantera"></div>
                <div class="auto__rueda auto__rueda--trasera"></div>
                <div class="auto__escape"></div>
            </div>
            
            <div class="auto auto--azul">
                <div class="auto__techo"></div>
                <div class="auto__cabina"></div>
                <div class="auto__parabrisas"></div>
                <div class="auto__spoiler"></div>
                <div class="auto__luces"></div>
                <div class="auto__rueda auto__rueda--delantera"></div>
                <div class="auto__rueda auto__rueda--trasera"></div>
                <div class="auto__escape"></div>
            </div>
            
            <div class="pista__meta"></div>
        </div>
    </main>

    <footer class="footer">
        <div class="footer__contenedor">
            <h2 class="footer__titulo">Contáctanos</h2>
            <div class="footer__redes">
                <a href="#" class="footer__link" aria-label="Instagram">
                    <i class="fab fa-instagram"></i>
                </a>
                <a href="#" class="footer__link" aria-label="WhatsApp">
                    <i class="fab fa-whatsapp"></i>
                </a>
                <a href="#" class="footer__link" aria-label="Facebook">
                    <i class="fab fa-facebook"></i>
                </a>
                <a href="#" class="footer__link" aria-label="LinkedIn">
                    <i class="fab fa-linkedin"></i>
                </a>
                <a href="#" class="footer__link" aria-label="GitHub">
                    <i class="fab fa-github"></i>
                </a>
                <a href="#" class="footer__link" aria-label="TikTok">
                    <i class="fab fa-tiktok"></i>
                </a>
                <a href="#" class="footer__link" aria-label="YouTube">
                    <i class="fab fa-youtube"></i>
                </a>
                <a href="#" class="footer__link" aria-label="Discord">
                    <i class="fab fa-discord"></i>
                </a>
            </div>
            <div class="footer__derechos">
                <p>&copy; 2025 IGNACIO ADRIAN LAYME DELGADO. Todos los derechos reservados.</p>
            </div>
        </div>
    </footer>
</body>
</html>
