<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evaluación DOM</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="container">
        <h2>Lista de Tareas</h2>
        <input type="text" id="newItem" placeholder="Nueva tarea" data-newItem required>
        <button id="addBtn"data-addBtn required>Agregar</button>
        <ul id="taskList" data-taskList required>
            <li class="item" >Tarea de ejemplo 1</li>
            <li class="item">Tarea de ejemplo 2</li>
        </ul>
        <div id="controls">
            <button id="toggleBtn"data-toggleBtn required>Tachar Último</button>
            <button id="countBtn"data-countBtn required>Contar Items</button>
        </div>
        <div id="output" data-output required></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
